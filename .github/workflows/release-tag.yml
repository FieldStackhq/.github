name: Release Tag (Reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the build artifact to attach to the release'
        required: false
        type: string
        default: ''
      artifact-path:
        description: 'Path to the build artifact'
        required: false
        type: string
        default: ''
      version:
        description: 'CalVer version to tag (e.g., 2026.3.5) instead of calculating one. For callers that stamp it into a build before the tag exists. Fails if its tag is on another commit.'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'The CalVer version that was created (e.g., 2026.3.5)'
        value: ${{ jobs.tag.outputs.version }}
      tag:
        description: 'The Git tag that was created (e.g., v2026.3.5)'
        value: ${{ jobs.tag.outputs.tag }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.calver.outputs.version }}
      tag: ${{ steps.calver.outputs.tag }}
    steps:
      - name: Clean workspace (self-hosted pre-run maintenance)
        working-directory: ${{ github.workspace }}
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        shell: bash
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0  # Full history for tag calculation and changelog

      - name: Calculate next CalVer version
        id: calver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*$ ]]; then
              echo "::error::version input is not CalVer YYYY.M.patch"
              exit 1
            fi
            # The caller's build carries this version: a tag on another commit fails; on this commit it is a re-run.
            if TAG_SHA=$(git rev-parse -q --verify "refs/tags/v${INPUT_VERSION}^{commit}"); then
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "::error::tag v${INPUT_VERSION} is already on ${TAG_SHA}; re-run the whole workflow so the build is stamped with a new version"
                exit 1
              fi
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using caller's version: ${INPUT_VERSION} (tag: v${INPUT_VERSION})"
            exit 0
          fi

          YEAR=$(date +%Y)
          MONTH=$(date +%-m)  # No zero-padding
          PREFIX="v${YEAR}.${MONTH}."

          # Find the highest patch number for this month (numeric sort, not lexicographic)
          LATEST_PATCH=$(git tag --list "${PREFIX}*" | sed "s|^${PREFIX}||" | sort -n -r | head -n 1)

          if [ -z "$LATEST_PATCH" ]; then
            PATCH=1
          else
            PATCH=$((LATEST_PATCH + 1))
          fi

          VERSION="${YEAR}.${MONTH}.${PATCH}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Calculated version: ${VERSION} (tag: ${TAG})"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.calver.outputs.tag }}"

          # Find the previous CalVer tag (excluding any tag we're about to create)
          PREV_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-creatordate | { grep -vxF "$TAG" || true; } | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Parse conventional commits into changelog sections
          FEATURES=""
          FIXES=""
          PERF=""
          BREAKING=""

          while IFS= read -r line; do
            # Skip empty lines
            [ -z "$line" ] && continue

            # Extract PR number if present
            PR_NUM=$(echo "$line" | grep -oP '\(#\d+\)' | tr -d '()')

            # Breaking changes go ONLY to BREAKING (not duplicated in Features/Fixes)
            if echo "$line" | grep -qP '^feat(\(.+\))?!:'; then
              ENTRY=$(echo "$line" | sed -E 's/^feat\(([^)]+)\)!: /- **\1**: /' | sed 's/^feat!: /- /')
              BREAKING="${BREAKING}${ENTRY}\n"
            elif echo "$line" | grep -qP '^fix(\(.+\))?!:'; then
              ENTRY=$(echo "$line" | sed -E 's/^fix\(([^)]+)\)!: /- **\1**: /' | sed 's/^fix!: /- /')
              BREAKING="${BREAKING}${ENTRY}\n"
            elif echo "$line" | grep -qP '^feat(\(.+\))?:'; then
              ENTRY=$(echo "$line" | sed -E 's/^feat\(([^)]+)\): /- **\1**: /' | sed 's/^feat: /- /')
              FEATURES="${FEATURES}${ENTRY}\n"
            elif echo "$line" | grep -qP '^fix(\(.+\))?:'; then
              ENTRY=$(echo "$line" | sed -E 's/^fix\(([^)]+)\): /- **\1**: /' | sed 's/^fix: /- /')
              FIXES="${FIXES}${ENTRY}\n"
            elif echo "$line" | grep -qP '^perf(\(.+\))?:'; then
              ENTRY=$(echo "$line" | sed -E 's/^perf\(([^)]+)\): /- **\1**: /' | sed 's/^perf: /- /')
              PERF="${PERF}${ENTRY}\n"
            fi
          done <<< "$(git log --oneline --format='%s' $RANGE)"

          # Build changelog body
          BODY="## What's Changed\n\n"

          if [ -n "$BREAKING" ]; then
            BODY="${BODY}### Breaking Changes\n${BREAKING}\n"
          fi
          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}### Bug Fixes\n${FIXES}\n"
          fi
          if [ -n "$PERF" ]; then
            BODY="${BODY}### Performance\n${PERF}\n"
          fi

          if [ -n "$PREV_TAG" ]; then
            BODY="${BODY}**Full Changelog**: ${PREV_TAG}...${TAG}\n"
          fi

          # Write to file for the release step
          echo -e "$BODY" > changelog.md
          echo "Generated changelog for ${TAG}"

      - name: Create Git tag
        if: steps.calver.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.calver.outputs.tag }}" -m "Release ${{ steps.calver.outputs.version }}"
          git push origin "${{ steps.calver.outputs.tag }}"

      - name: Download build artifact
        if: inputs.artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ./release-artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          name: ${{ steps.calver.outputs.version }}
          body_path: changelog.md
          files: |
            ./release-artifact/**
          draft: false
          prerelease: false
