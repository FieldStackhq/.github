name: SQL Validation (Reusable)

on:
  workflow_call:
    inputs:
      schema:
        description: 'The SQL schema this repo owns'
        required: true
        type: string
      migration-prefix:
        description: 'Expected prefix for migration filenames'
        required: true
        type: string
      skip-immutability-check:
        description: 'One-time bypass for migration renames (set to true, remove after merge)'
        required: false
        type: boolean
        default: false
      allowed-read-schemas:
        description: 'Comma-separated list of schemas this repo can SELECT from'
        required: false
        type: string
        default: 'dbo'
      dispatch-dev-deploy:
        description: >-
          On merge to main, dispatch the dev DB deploy (domain-sql-updated) to
          fieldstack-db-deploy. Set false when the calling repo deploys its own
          dev DB by another mechanism (e.g. from its release pipeline) -- this
          flag only disables the dispatch from this workflow; SQL validation
          still runs.
        required: false
        type: boolean
        default: true
    secrets:
      ORCHESTRATOR_PAT:
        description: 'PAT to send repository_dispatch to orchestrator'
        required: false

jobs:
  validate:
    runs-on: [self-hosted, linux, x64]
    # db_changed drives both this job's checks and the notify dispatch. The job
    # itself always runs (so a caller that drops its push `paths:` filter still
    # gets a green check on every main push); the work inside is gated on a real
    # git diff instead.
    outputs:
      db_changed: ${{ steps.detect.outputs.db_changed }}
    steps:
      - name: Clean workspace (self-hosted pre-run maintenance)
        working-directory: ${{ github.workspace }}
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        shell: bash
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Detect db/ changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        # git diff is authoritative about what changed. GitHub's push/PR
        # `paths:` filter only inspects the first ~300 files of a diff, so a
        # repo-wide commit (e.g. a format-everything PR) can hide its db/ files
        # past that window and silently skip the whole dispatch. Computing the
        # change set here removes that dependency: a caller can trigger on every
        # main push and rely on this gate.
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF:-main}...HEAD"
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE} ${GITHUB_SHA}"
          else
            # New branch / unknown base -- no computable range. Assume changed so
            # a real db/ edit is never dropped (an extra no-op deploy is
            # harmless; a missed one is the bug this gate exists to prevent).
            RANGE=""
          fi
          if [ -z "$RANGE" ]; then
            CHANGED=true
          elif git diff --name-only $RANGE -- 'db/**' | grep -q .; then
            CHANGED=true
          else
            CHANGED=false
          fi
          echo "event=$EVENT range='${RANGE:-<assume-changed>}' db_changed=$CHANGED"
          echo "db_changed=$CHANGED" >> "$GITHUB_OUTPUT"
          # Exported so the lint step scopes to the same change set this gate
          # computed, rather than recomputing (and drifting from) it. Empty when
          # no range was computable -- the lint step reads that as "lint everything".
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.db_changed == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install sqlfluff
        if: steps.detect.outputs.db_changed == 'true'
        run: pip install sqlfluff==3.*

      - name: Lint SQL files
        if: steps.detect.outputs.db_changed == 'true'
        env:
          RANGE: ${{ steps.detect.outputs.range }}
        # Lint only the SQL files this change actually touches. Linting the whole
        # db/ tree cost ~8 minutes on a ~850-file repo (sqlfluff is ~0.8s/file and
        # single-process by default) to re-report thousands of pre-existing style
        # warnings on files no PR touched. Scoped to a typical 1-5 file change it
        # runs in ~2s.
        #
        # Deliberately NOT passing --processes: on a handful of files the process
        # pool costs more to start than it saves (measured 3.4s vs 1.8s on 4
        # files). It only pays off on a full-tree run.
        #
        # Note this stays non-gating (`|| true`), as before -- it emits
        # annotations, it does not fail the build.
        run: |
          set -euo pipefail

          if [ -z "${RANGE:-}" ]; then
            # No computable range (new branch / unknown base). Fall back to the
            # full tree so a real change is never silently left unlinted.
            echo "No diff range -- linting the full db/ tree."
            mapfile -t FILES < <(find db/ -name '*.sql' -type f | sort)
          else
            # --diff-filter excludes deletions (D): a deleted .sql has no file to
            # lint and sqlfluff errors on a missing path.
            mapfile -t FILES < <(
              git diff --name-only --diff-filter=ACMRT $RANGE -- db/ \
                | grep -E '\.sql$' | sort || true
            )
          fi

          # A rename can still leave a path that no longer exists on disk.
          KEPT=()
          for f in ${FILES[@]+"${FILES[@]}"}; do
            [ -f "$f" ] && KEPT+=("$f")
          done

          if [ ${#KEPT[@]} -eq 0 ]; then
            echo "No SQL files to lint -- skipping."
            exit 0
          fi

          echo "Linting ${#KEPT[@]} SQL file(s):"
          printf '  %s\n' "${KEPT[@]}"
          sqlfluff lint "${KEPT[@]}" \
            --dialect tsql \
            --config db/.sqlfluff \
            --format github-annotation-native \
            || true

      - name: Validate migration filenames (YYYYMMDD_PREFIX_NNN__description.sql)
        if: steps.detect.outputs.db_changed == 'true'
        run: |
          ERRORS=0
          PREFIX="${{ inputs.migration-prefix }}"
          for f in $(git diff --name-only --diff-filter=A origin/main -- 'db/migrations/*.sql'); do
            BASENAME=$(basename "$f")
            if ! echo "$BASENAME" | grep -qP "^\d{8}_${PREFIX}_\d{3}__\w+\.sql$"; then
              echo "::error file=$f::Invalid migration name. Expected: YYYYMMDD_${PREFIX}_NNN__description.sql"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: Check migration ID uniqueness (no duplicate IDs vs main or within the PR)
        if: steps.detect.outputs.db_changed == 'true'
        # Catches at PR time the duplicate-migration-ID condition that otherwise only surfaces when
        # the cross-repo db-deploy manifest is built post-merge (SqlCollector.BuildManifest ->
        # "Duplicate migration ID ... found in" -> the deploy aborts). The migration ID is the
        # filename up to '__' (matching db-deploy's ExtractMigrationId). Because every repo owns a
        # unique migration prefix, two repos cannot produce the same ID -- an ID collision is always
        # WITHIN one repo -- so comparing the PR's new IDs against this repo's own main is sufficient,
        # and this runs for every repo that calls this reusable workflow.
        #
        # Caveat: this compares against main as it is when the check runs. Two concurrently-open PRs
        # that each add the same ID both pass until one merges; the second is caught only when it is
        # re-validated against the now-updated main. Pair this with require-branches-up-to-date (or a
        # merge queue) on db-touching repos to close that race; an --admin merge of a stale branch
        # bypasses it.
        run: |
          set -euo pipefail
          id_of() { basename "$1" | sed -E 's/__.*//'; }

          # Raw (non-unique) IDs this PR adds; the filename step already guaranteed each has '__',
          # so id_of always yields a non-empty value.
          ADDED_RAW=$(
            for f in $(git diff --name-only --diff-filter=A origin/main -- 'db/migrations/*.sql'); do
              id_of "$f"
            done
          )
          if [ -z "$ADDED_RAW" ]; then
            echo "No new migrations -- nothing to check."
            exit 0
          fi
          ADDED_IDS=$(printf '%s\n' "$ADDED_RAW" | sort -u)

          # IDs already on main. The '|| true' is load-bearing: with pipefail, grep exits 1 when the
          # repo has no migrations on main yet (its first migration, or no db/migrations dir), which
          # would otherwise abort the script with no annotation. An empty set is the correct result.
          EXISTING_IDS=$(
            git ls-tree -r --name-only origin/main -- db/migrations \
              | grep -E '\.sql$' | while IFS= read -r f; do id_of "$f"; done | sort -u \
              || true
          )

          FAIL=0
          # (a) a new ID that already exists on main (branched from stale main, or a concurrent PR's
          #     ID already merged). Both inputs are sorted-unique, so intersect with comm.
          CONFLICTS=$(comm -12 <(printf '%s\n' "$ADDED_IDS") <(printf '%s\n' "$EXISTING_IDS"))
          if [ -n "$CONFLICTS" ]; then
            while IFS= read -r id; do
              echo "::error::Migration ID '$id' already exists on main. Renumber the new migration to the next free ID."
            done <<< "$CONFLICTS"
            FAIL=1
          fi

          # (b) two new migration files in this PR sharing one ID
          DUP_IN_PR=$(printf '%s\n' "$ADDED_RAW" | sort | uniq -d)
          if [ -n "$DUP_IN_PR" ]; then
            echo "::error::Two new migrations in this PR share a migration ID: $(echo "$DUP_IN_PR" | tr '\n' ' ')"
            FAIL=1
          fi

          if [ "$FAIL" -eq 0 ]; then
            echo "OK: $(printf '%s\n' "$ADDED_IDS" | wc -l) new migration ID(s) are unique vs main."
          fi
          exit $FAIL

      - name: Check migration immutability
        if: ${{ steps.detect.outputs.db_changed == 'true' && !inputs.skip-immutability-check }}
        run: |
          MODIFIED=$(git diff --name-only --diff-filter=M origin/main -- 'db/migrations/*.sql')
          if [ -n "$MODIFIED" ]; then
            echo "::error::Migrations are immutable once merged. These files were modified:"
            echo "$MODIFIED"
            exit 1
          fi

      - name: Validate schema ownership
        if: steps.detect.outputs.db_changed == 'true'
        run: |
          SCHEMA="${{ inputs.schema }}"
          ERRORS=0
          for f in $(find db/ -name '*.sql' -type f); do
            VIOLATIONS=$(grep -inP '(CREATE|ALTER|DROP)\s+(TABLE|PROCEDURE|FUNCTION|VIEW|INDEX|TRIGGER|SCHEMA)\s+\[?(?!'"$SCHEMA"'\b)(?!dbo\b)(\w+)\]?\.' "$f" 2>/dev/null || true)
            if [ -n "$VIOLATIONS" ]; then
              echo "::error file=$f::Schema ownership violation -- this repo can only CREATE/ALTER/DROP in [$SCHEMA]:"
              echo "$VIOLATIONS"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: Validate programmable objects use CREATE OR ALTER
        if: steps.detect.outputs.db_changed == 'true'
        run: |
          ERRORS=0
          for f in $(find db/programmable/ -name '*.sql' -type f 2>/dev/null); do
            if ! grep -qiP 'CREATE\s+OR\s+ALTER' "$f"; then
              echo "::error file=$f::Programmable objects must use CREATE OR ALTER"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: Check for dangerous operations in migrations
        if: steps.detect.outputs.db_changed == 'true'
        # Only scan db/migrations/. Programmable objects (sprocs, views,
        # functions) legitimately use DROP TABLE #temp and TRUNCATE TABLE #temp
        # for temp tables. Those are never migration-safety concerns.
        run: |
          ERRORS=0
          for f in $(git diff --name-only origin/main -- 'db/migrations/*.sql'); do
            [ -f "$f" ] || continue
            if grep -qiP 'DROP\s+TABLE' "$f" && ! grep -qF -- '-- APPROVED-DROP' "$f"; then
              echo "::error file=$f::Contains DROP TABLE without '-- APPROVED-DROP: reason' comment"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -qiP '\bTRUNCATE\b' "$f"; then
              echo "::error file=$f::TRUNCATE is not allowed in migrations"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

  notify:
    # Dispatch only when a main push actually changed db/ (per the git-diff
    # gate, not GitHub's path filter). validate is a dependency so a failing
    # check still blocks the dispatch. Skipped entirely when the caller sets
    # dispatch-dev-deploy: false (it deploys its own dev DB another way).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.db_changed == 'true' && inputs.dispatch-dev-deploy }}
    needs: validate
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Clean workspace (self-hosted pre-run maintenance)
        working-directory: ${{ github.workspace }}
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        shell: bash
      # A silently-skipped dispatch means a merged db/ change never deploys.
      # Missing PAT -> visible warning annotation (green run); dispatch API
      # failure -> red run. The orchestrator's detect-missed-dispatch watchdog
      # remains the retroactive backstop either way.
      - name: Check ORCHESTRATOR_PAT availability
        id: pat
        env:
          PAT: ${{ secrets.ORCHESTRATOR_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORCHESTRATOR_PAT is not set -- skipping the db-deploy dispatch. This merged db/ change will NOT deploy until a deploy is triggered another way."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signal orchestrator
        # Explicit success(): a custom if drops the implicit guard, and this
        # step must not fire after a failure in any step added before it.
        if: success() && steps.pat.outputs.available == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.ORCHESTRATOR_PAT }}
          repository: FieldStackHQ/fieldstack-db-deploy
          event-type: domain-sql-updated
          client-payload: '{"repo": "${{ github.repository }}", "schema": "${{ inputs.schema }}", "sha": "${{ github.sha }}", "triggered_by": "${{ github.actor }}"}'

  # Breadcrumb for the suppressed-dispatch case: when a main push changed db/ but
  # the caller set dispatch-dev-deploy: false, the `notify` job is skipped and a
  # skipped job alone cannot say WHY (deliberate flag vs. not-a-main-push vs. no
  # db/ change all look identical). This sibling job runs only on the deliberate
  # suppression and leaves a searchable ::notice:: in the log. A step inside
  # `notify` could not do this -- steps do not run when their job is gated out.
  notify-suppressed:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.db_changed == 'true' && !inputs.dispatch-dev-deploy }}
    needs: validate
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Note suppressed dispatch
        run: echo "::notice::dispatch-dev-deploy is false -- the domain-sql-updated dispatch was skipped for this db/ change. The calling repo is expected to deploy its own dev DB (e.g. from its release pipeline)."
