name: CI (Reusable)

on:
  workflow_call:
    inputs:
      build-command:
        description: 'Build command (e.g., dotnet build, npm run build)'
        required: true
        type: string
      test-command:
        description: 'Test command (e.g., dotnet test, npm test)'
        required: true
        type: string
      working-directory:
        description: 'Working directory for build/test'
        required: false
        type: string
        default: '.'
      node-version:
        required: false
        type: string
        default: ''
      dotnet-version:
        required: false
        type: string
        default: ''

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Clean workspace (self-hosted pre-run maintenance)
        working-directory: ${{ github.workspace }}
        run: sudo find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        shell: bash
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        if: inputs.dotnet-version != ''
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Test
        run: ${{ inputs.test-command }}
